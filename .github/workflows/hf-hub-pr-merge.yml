name: hf-hub-pr-merge

# Explicit owner action after reviewing a byte-verified Hub proposal.
# This workflow merges only the proposal bound to a published GitHub release;
# it cannot create a Hub tag or a MEASURED publication receipt.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag for the proposal
        required: true
      only:
        description: Exact Hub repository target
        required: true
      proposal_run:
        description: Failed hf-mirror run containing the verified pending proposal artifact
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: hf-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  merge-hub-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      HF_REPO_ID: ${{ inputs.only }}
      HF_REPO_TYPE: model
      HF_MIRROR_OIDC_RESOURCE: ${{ inputs.only }}
      HF_PROPOSAL_RUN: ${{ inputs.proposal_run }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release-source
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade "huggingface_hub[cli,hf_xet]==2.0.0" pyyaml
      - name: Verify manual scope and published source
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ''
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || {
            echo "::error::Hub PR merge must run on reviewed default branch"; exit 1;
          }
          test "$HF_REPO_ID" = "SZLHOLDINGS/szl-lambda-gate" || {
            echo "::error::unsupported Hub PR merge target"; exit 1;
          }
          [[ "$HF_PROPOSAL_RUN" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::invalid proposal run ID"; exit 1;
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::invalid release tag"; exit 1;
          }
          git -C release-source show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          source_sha=$(git -C release-source rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$source_sha" = "$(git -C release-source rev-parse HEAD)" || {
            echo "::error::release checkout does not match tag"; exit 1;
          }
          git merge-base --is-ancestor "$source_sha" HEAD || {
            echo "::error::release source is not an ancestor of reviewed main"; exit 1;
          }
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,assets,url,body > .hfmirror-release.json
          jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false' \
            .hfmirror-release.json >/dev/null
          echo "SOURCE_GITHUB_SHA=$source_sha" >> "$GITHUB_ENV"
      - name: Retrieve exact verified proposal
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ''
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HF_PROPOSAL_RUN" \
            > .hfmirror-proposal-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$DEFAULT_BRANCH" \
            --arg run "$HF_PROPOSAL_RUN" \
              '(.id | tostring) == $run and .repository.full_name == $repo and
               .head_repository.full_name == $repo and .head_branch == $branch and
               .path == ".github/workflows/hf-mirror.yml" and
               .event == "workflow_dispatch" and .conclusion == "failure" and
               (.head_sha | test("^[0-9a-f]{40}$"))' \
            .hfmirror-proposal-run.json >/dev/null
          proposal_sha=$(jq -r '.head_sha' .hfmirror-proposal-run.json)
          git merge-base --is-ancestor "$proposal_sha" HEAD || {
            echo "::error::proposal workflow commit is not an ancestor of reviewed main"; exit 1;
          }
          gh run download "$HF_PROPOSAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "hf-mirror-proposal-lambda-gate-$RELEASE_TAG" --dir .hfmirror-proposal
          test -f .hfmirror-proposal/hf-mirror-proposal.json
          mv .hfmirror-proposal/hf-mirror-proposal.json .hfmirror-proposal.json
      - name: Verify owner Hub credential
        env:
          HF_FALLBACK_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_FALLBACK_TOKEN:-}" ]; then
            echo "::error::UNAVAILABLE - HF_TOKEN secret is absent"; exit 1
          fi
          echo "::add-mask::$HF_FALLBACK_TOKEN"
          python - <<'PY'
          import os
          from huggingface_hub import auth_check

          repo = os.environ["HF_REPO_ID"]
          try:
              auth_check(repo_id=repo, repo_type=os.environ["HF_REPO_TYPE"],
                         token=os.environ["HF_FALLBACK_TOKEN"], write=True)
          except Exception as exc:
              raise SystemExit(f"UNAVAILABLE - owner secret cannot write {repo}: {type(exc).__name__}") from None
          print(f"owner write access verified for {repo}")
          PY
          printf 'HF_TOKEN=%s\n' "$HF_FALLBACK_TOKEN" >> "$GITHUB_ENV"
          echo "HF_AUTH_MODE=pat" >> "$GITHUB_ENV"
      - name: Verify, open, merge, and read back Hub PR
        env:
          HF_OIDC_RESOURCE: ''
        run: python scripts/hf_mirror_finalize.py merge
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        env:
          HF_TOKEN: ''
        with:
          name: hf-mirror-merge-lambda-gate-${{ inputs.tag }}
          path: hf-mirror-merge.json
          if-no-files-found: error
