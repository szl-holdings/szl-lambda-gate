name: hf-mirror

# SZL Holdings - GitHub -> Hugging Face mirror, one workflow, two lanes.
#
#   lane A (continuous): push to main -> huggingface/hub-sync, OPT-IN per target
#   lane B (versioned):  release published -> hf upload + HfApi.create_tag
#
# Lane A is opt-in because hub-sync propagates deletions: a Hub repo that holds
# artifacts absent from the GitHub tree (Kernel Hub builds, receipts, curated
# cards) would be stripped. Set "mirror_on_push": false on those targets.
# Lane B uploads additively and verifies retained Hub files byte for byte.
# A published release dispatches the publisher on main so a branch-bound
# Trusted Publisher can attest the workflow identity.
#
# AUTH: Trusted Publishers are the default. huggingface_hub exchanges GitHub
# OIDC for a short-lived Hub token only when HF_OIDC_RESOURCE is set. For model
# repos that value is namespace/name (the hf_repo_id). Spaces/datasets/kernels
# use the prefixed form (spaces/ns/name, datasets/ns/name, kernels/ns/name).
# Declare it on the target as oidc_resource. An explicit manual dispatch may
# select the existing repository HF_TOKEN secret for a temporary PAT proof;
# automatic release dispatches continue to use OIDC.
#
# Targets are declared in .github/hf-mirror.json.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)mirror
        required: false
      only:
        description: Limit to a single hf_repo_id
        required: false
      auth:
        description: Authentication mode for a manual release dispatch
        type: choice
        required: false
        default: oidc
        options: [oidc, pat]

permissions:
  contents: read

concurrency:
  group: hf-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Dispatch reviewed publisher on main
        run: |
          set -euo pipefail
          payload=$(jq -n --arg ref "$DEFAULT_BRANCH" --arg tag "$RELEASE_TAG" \
            '{ref: $ref, inputs: {tag: $tag, auth: "oidc"}}')
          response=$(gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/hf-mirror.yml/dispatches" \
            --input - <<<"$payload")
          run_id=$(jq -r '.workflow_run_id // empty' <<<"$response")
          [ -n "$run_id" ] || { echo "::error::publisher run ID missing"; exit 1; }
          echo "publisher run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

  plan:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.load.outputs.targets }}
      push_targets: ${{ steps.load.outputs.push_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
      - id: load
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          test -f .github/hf-mirror.json || { echo "::error::.github/hf-mirror.json missing"; exit 1; }
          targets=$(jq -c --arg only "$ONLY" \
            '[ .targets[] | select($only == "" or .hf_repo_id == $only) ]' .github/hf-mirror.json)
          [ "$(jq 'length' <<<"$targets")" -gt 0 ] || { echo "::error::no targets matched"; exit 1; }
          missing=$(jq -r '.[] | select((.oidc_resource // "") == "") | .hf_repo_id' <<<"$targets")
          if [ -n "$missing" ]; then
            echo "::error::UNAVAILABLE - oidc_resource missing for: $missing"
            exit 1
          fi
          push_targets=$(jq -c '[ .[] | select(.mirror_on_push != false) ]' <<<"$targets")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "push_targets=$push_targets" >> "$GITHUB_OUTPUT"
          echo "lane A targets: $(jq 'length' <<<"$push_targets") of $(jq 'length' <<<"$targets")"

  sync:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.push_targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.push_targets) }}
    steps:
      - uses: huggingface/hub-sync@fdffea8e04104d0bd4e3181c5feb3025f0433ff5  # v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ matrix.target.hf_repo_id }}
          repo_type: ${{ matrix.target.repo_type }}
          subdirectory: ${{ matrix.target.subdirectory }}
          hf_token: ${{ secrets.HF_TOKEN }}

  release-mirror:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      HF_REPO_ID: ${{ matrix.target.hf_repo_id }}
      HF_REPO_TYPE: ${{ matrix.target.repo_type }}
      SUBDIR: ${{ matrix.target.subdirectory }}
      HF_OIDC_RESOURCE: ${{ matrix.target.oidc_resource }}
      HF_MIRROR_OIDC_RESOURCE: ${{ matrix.target.oidc_resource }}
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release-source
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade "huggingface_hub[cli,hf_xet]>=1.32.0" pyyaml

      - name: Verify published release and exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C release-source show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          source_sha=$(git -C release-source rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$source_sha" = "$(git -C release-source rev-parse HEAD)" || {
            echo "::error::release checkout does not match tag"; exit 1;
          }
          git merge-base --is-ancestor "$source_sha" HEAD || {
            echo "::error::release tag is not an ancestor of reviewed main"; exit 1;
          }
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,assets,url,body > .hfmirror-release.json
          jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false' \
            .hfmirror-release.json >/dev/null
          echo "SOURCE_GITHUB_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "release source commit: $source_sha"

      - name: Validate Hub credential mode
        env:
          AUTH_MODE: ${{ inputs.auth }}
        run: |
          set -euo pipefail
          if [ -z "${HF_OIDC_RESOURCE:-}" ]; then
            echo "::error::UNAVAILABLE - HF_OIDC_RESOURCE empty for $HF_REPO_ID"
            exit 1
          fi
          case "$AUTH_MODE" in
            oidc|pat) ;;
            *) echo "::error::UNAVAILABLE - unsupported authentication mode"; exit 1 ;;
          esac

      - name: Resolve Hub credential (PAT)
        if: inputs.auth == 'pat'
        env:
          HF_FALLBACK_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_FALLBACK_TOKEN:-}" ]; then
            echo "::error::UNAVAILABLE - HF_TOKEN repository secret is absent"
            exit 1
          fi
          echo "::add-mask::$HF_FALLBACK_TOKEN"
          python - <<'PY'
          import os
          from huggingface_hub import auth_check

          repo = os.environ["HF_REPO_ID"]
          try:
              auth_check(repo_id=repo, repo_type=os.environ["HF_REPO_TYPE"],
                         token=os.environ["HF_FALLBACK_TOKEN"], write=True)
          except Exception as exc:
              raise SystemExit(f"UNAVAILABLE - repository secret cannot write {repo}: {type(exc).__name__}") from None
          print(f"repository secret write access verified for {repo}")
          PY
          printf 'HF_TOKEN=%s\n' "$HF_FALLBACK_TOKEN" >> "$GITHUB_ENV"
          echo "HF_AUTH_MODE=pat" >> "$GITHUB_ENV"

      - name: Resolve Hub credential (OIDC)
        if: inputs.auth == 'oidc'
        run: |
          set -euo pipefail
          echo "oidc_resource=$HF_OIDC_RESOURCE"
          oidc_error="$(mktemp)"
          oidc_token=""
          if oidc_token="$(hf auth token 2>"$oidc_error")" && [ -n "$oidc_token" ]; then
            echo "::add-mask::$oidc_token"
            printf 'HF_TOKEN=%s\n' "$oidc_token" >> "$GITHUB_ENV"
            echo "HF_AUTH_MODE=oidc" >> "$GITHUB_ENV"
          else
            echo "::error::UNAVAILABLE - trusted-publisher exchange failed for $HF_REPO_ID"
            if [ -s "$oidc_error" ]; then
              sed -E 's/hf_[A-Za-z0-9_-]+/[REDACTED]/g' "$oidc_error" >&2 || true
            fi
            rm -f "$oidc_error"
            exit 1
          fi
          rm -f "$oidc_error"

      - name: Stage payload
        run: |
          set -euo pipefail
          rm -rf .hfstage && mkdir -p .hfstage
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude '.hfstage' \
            --exclude 'tests' --exclude '__pycache__' \
            "release-source/${SUBDIR:-.}/" .hfstage/
          python scripts/hf_mirror_release.py stage

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .hfmirror-assets
          if [ "$(jq '.assets | length' .hfmirror-release.json)" -gt 0 ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --dir .hfmirror-assets
          fi
          python scripts/hf_mirror_release.py assets
          if grep -rIl 'version https://git-lfs.github.com/spec/v1' .hfstage >/dev/null 2>&1; then
            echo "::error::UNAVAILABLE - unresolved Git LFS pointers in payload"; exit 1
          fi

      - name: Capture Hub baseline and check preservation
        env:
          HF_OIDC_RESOURCE: ''
        run: python scripts/hf_mirror_release.py preflight

      - name: Render and validate model card
        env:
          HF_OIDC_RESOURCE: ''
          HUB_CARD_PATH: .hfmirror-baseline/README.md
          PRESERVE_HUB_CARD: 'true'
          CARD_TEMPLATE: ${{ matrix.target.card_template }}
        run: python scripts/render_model_card.py

      - name: Publish, bind tag, verify bytes, and emit receipt
        env:
          HF_OIDC_RESOURCE: ''
        run: python scripts/hf_mirror_release.py publish

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: hf-mirror-receipt-${{ matrix.target.slug }}-${{ env.RELEASE_TAG }}
          path: hf-mirror-receipt.json
