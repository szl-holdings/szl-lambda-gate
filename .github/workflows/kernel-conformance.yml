name: kernel-distribution-conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kernels-version: ["0.12.3", "0.17.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install CPU loader dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "kernels==${{ matrix.kernels-version }}"
      - name: Package committed GitHub source
        run: python scripts/build_lambda_distribution.py --revision HEAD --output build/distribution
      - name: Verify bytes and run every vector through the loader
        env:
          HF_HUB_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/check_lambda_distribution.py --local build/distribution \
            --expected-commit "$(git rev-parse HEAD)" --receipt build/conformance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lambda-distribution-kernels-${{ matrix.kernels-version }}
          path: |
            build/distribution
            build/conformance.json
